name: Publish React app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Validate all 24 lessons and 240 questions
        run: npm run check:content

      - name: Test study backup validation
        run: npm run test:backup

      - name: Validate source-linked concept references
        run: npm run test:concepts

      - name: Verify narration text chunking
        run: npm run test:speech

      - name: Validate original weekly exercise links
        run: npm run test:practice

      - name: Validate source-backed recall deck and review schedule
        run: npm run test:recall

      - name: Verify private 24-week dashboard metrics
        run: npm run test:dashboard

      - name: Verify exact source search and passage links
        run: npm run test:search

      - name: Verify private saved-source references and notes
        run: npm run test:shelf

      - name: Build React for repository subpath
        env:
          DEPLOY_TARGET: github-pages
        run: npm run build

      - name: Install Chromium for live-render smoke test
        run: npx playwright install --with-deps chromium

      - name: Ensure React renders before publishing
        run: npm run test:browser

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload built site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      # Pages artifact metadata can be briefly unavailable immediately after
      # upload. A fresh run plus this brief propagation window prevents a
      # transient "No artifacts named github-pages" error in deploy-pages.
      - name: Allow Pages artifact metadata to propagate
        run: sleep 15

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
