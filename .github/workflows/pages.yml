name: Publish React app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Validate all 24 lessons and 240 questions
        run: npm run check:content

      - name: Test study backup validation
        run: npm run test:backup

      - name: Validate source-linked concept references
        run: npm run test:concepts

      - name: Build React for repository subpath
        env:
          DEPLOY_TARGET: github-pages
        run: npm run build

      - name: Install Chromium for live-render smoke test
        run: npx playwright install --with-deps chromium

      - name: Ensure React renders before publishing
        run: npm run test:browser

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload built site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
