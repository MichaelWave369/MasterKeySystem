name: React build and source validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install
      - name: Validate original lesson corpus
        run: npm run check:content
      - name: Test study backup data validation
        run: npm run test:backup
      - name: Validate source-linked concept references
        run: npm run test:concepts
      - name: Verify narration text chunking
        run: npm run test:speech

      - name: Validate original weekly exercise links
        run: npm run test:practice

      - name: Validate source-backed recall deck and review schedule
        run: npm run test:recall

      - name: Verify private 24-week dashboard metrics
        run: npm run test:dashboard

      - name: Verify exact source search and passage links
        run: npm run test:search

      - name: Build app for GitHub Pages subpath
        run: npm run build
        env:
          DEPLOY_TARGET: github-pages
      - name: Install Chromium for runtime smoke test
        run: npx playwright install --with-deps chromium
      - name: Verify React actually renders and navigation works
        run: npm run test:browser
